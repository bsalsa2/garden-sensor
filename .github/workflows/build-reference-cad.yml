name: Build reference CAD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-cad:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CadQuery
        run: python -m pip install --upgrade pip cadquery
      - name: Generate STEP and STL reference assembly
        working-directory: garden-sensor/hardware
        run: python generate_reference_model.py
      - name: Install FreeCAD command line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y freecad
      - name: Generate editable FreeCAD document
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: |
          if command -v freecadcmd >/dev/null 2>&1; then
            freecadcmd garden-sensor/hardware/generate_reference_assembly.FCMacro
          elif command -v FreeCADCmd >/dev/null 2>&1; then
            FreeCADCmd garden-sensor/hardware/generate_reference_assembly.FCMacro
          else
            echo "FreeCAD command-line executable not found"
            exit 1
          fi
          test -s garden-sensor/hardware/garden_sensor_reference_assembly.FCStd
      - name: Commit generated CAD exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-sensor/hardware/garden_sensor_reference_assembly.step
          git add garden-sensor/hardware/garden_sensor_reference_assembly.stl
          git add garden-sensor/hardware/garden_sensor_reference_assembly.FCStd
          if git diff --cached --quiet; then
            echo "CAD exports are already up to date."
          else
            git commit -m "Generate editable reference CAD assembly"
            git push
          fi
