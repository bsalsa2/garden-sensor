name: Build reference CAD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-cad:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python for CadQuery
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CadQuery
        run: python -m pip install --upgrade pip cadquery
      - name: Generate STEP and STL reference assembly
        working-directory: garden-sensor/hardware
        run: python generate_reference_model.py
      - name: Install Miniforge
        run: |
          curl -L -o Miniforge3.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
          bash Miniforge3.sh -b -p "$HOME/miniforge3"
          echo "$HOME/miniforge3/bin" >> "$GITHUB_PATH"
      - name: Install FreeCAD from conda-forge
        run: conda create --yes --name freecad-env --channel conda-forge freecad
      - name: Generate editable FreeCAD document
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: |
          conda run --no-capture-output --name freecad-env freecadcmd garden-sensor/hardware/generate_reference_assembly.FCMacro
          test -s garden-sensor/hardware/garden_sensor_reference_assembly.FCStd
      - name: Commit generated CAD exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-sensor/hardware/garden_sensor_reference_assembly.step
          git add garden-sensor/hardware/garden_sensor_reference_assembly.stl
          git add garden-sensor/hardware/garden_sensor_reference_assembly.FCStd
          if git diff --cached --quiet; then
            echo "CAD exports are already up to date."
          else
            git commit -m "Generate editable reference CAD assembly"
            git push
          fi
